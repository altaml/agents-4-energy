version: 1
backend:
  phases:
    install:
      commands:
        - echo "Installing NVM and Node.js 20.9.0"
        - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
        - export NVM_DIR="$HOME/.nvm"
        - '[ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"'
        - nvm install 20.9.0
        - nvm alias default 20.9.0
        - nvm use 20.9.0
        - node --version
        - npm --version
    preBuild:
      commands:
        - echo "Ensuring NVM is available in preBuild phase"
        - export NVM_DIR="$HOME/.nvm"
        - |
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "NVM not found, installing..."
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
          else
            echo "NVM found, sourcing..."
          fi
          [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
          nvm install 20.9.0
          nvm alias default 20.9.0
        - nvm use 20.9.0
        - echo "Build environment is $CODEBUILD_BUILD_IMAGE"
        - node --version
    build:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - '[ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"'
        - nvm install 20.9.0
        - nvm use 20.9.0
        - node --version
        - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
        - timeout 15 sh -c "until docker info; do sleep 1; done"
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    install:
      commands:
        - echo "Installing NVM and Node.js 20.9.0 for frontend"
        - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
        - export NVM_DIR="$HOME/.nvm"
        - '[ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"'
        - nvm install 20.9.0
        - nvm alias default 20.9.0
        - nvm use 20.9.0
        - node --version
        - npm --version
    build:
      commands:
        - echo "Ensuring NVM is available in frontend build phase"
        - export NVM_DIR="$HOME/.nvm"
        - |
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "NVM not found, installing..."
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
          else
            echo "NVM found, sourcing..."
          fi
          [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
          nvm install 20.9.0
          nvm alias default 20.9.0
        - nvm use 20.9.0
        - node --version
        - npm ci
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
