version: 1
backend:
  phases:
    install:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
        - source "$NVM_DIR/nvm.sh"
        - nvm install 20.9.0
        - nvm use 20.9.0
        - node --version
        - npm --version
    preBuild:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - source "$NVM_DIR/nvm.sh"
        - nvm use 20.9.0
        - echo "Build environment is $CODEBUILD_BUILD_IMAGE"
    build:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - source "$NVM_DIR/nvm.sh"
        - nvm use 20.9.0
        - node --version
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    install:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
        - source "$NVM_DIR/nvm.sh"
        - nvm install 20.9.0
        - nvm use 20.9.0
        - node --version
        - npm --version
    build:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - source "$NVM_DIR/nvm.sh"
        - nvm use 20.9.0
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
